<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SocialX - Moments, Reels, Stories, Notes & Music</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app-container">
    <!-- Top Header -->
    <header class="app-header" id="app-header">
      <a href="javascript:void(0)" class="brand-badge" onclick="navigateTo('home')">
        <div class="brand-logo-icon">X</div>
        <span class="brand-name">SocialX</span>
      </a>

      <div class="header-actions">
        <button class="icon-btn" onclick="navigateTo('notifications')" title="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>

        <button class="icon-btn" onclick="navigateTo('messages')" title="Direct Messages">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span class="badge-count" id="msg-badge" style="display: none;">0</span>
        </button>
      </div>
    </header>

    <!-- Main View Container -->
    <main class="main-view" id="main-content">
      <!-- Dynamic Screens Injected Here -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="app-nav" id="app-nav">
      <button class="nav-item active" data-screen="home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </button>

      <button class="nav-item" data-screen="search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <span>Explore</span>
      </button>

      <button class="nav-item" data-screen="create">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5" ry="5"/><path d="M12 8v8M8 12h8"/></svg>
        <span>Create</span>
      </button>

      <button class="nav-item" data-screen="reels">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
        <span>Reels</span>
      </button>

      <button class="nav-item" data-screen="profile">
        <img id="nav-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="nav-avatar-icon" alt="Profile" />
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="/e2ee.js"></script>
  <script src="/music-catalog.js"></script>
  <script src="/app.js"></script>
</body>
</html>
